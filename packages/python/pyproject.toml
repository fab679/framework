[project]
name = "framework-agents"
version = "0.2.0"
description = "Python agent framework: ReAct loop, tools, memory, streaming, budgets, middleware, multi-agent, semantic graph, A2A serving - parity with the TypeScript package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Framework Agents" }]
keywords = ["agents", "llm", "ai", "asyncio", "streaming", "mcp", "a2a", "semantic-web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/fab679/framework"
Documentation = "https://fab679.github.io/framework/"
Repository = "https://github.com/fab679/framework"
Changelog = "https://github.com/fab679/framework/releases"

[project.optional-dependencies]
dev = [
  "anyio>=4",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real Together API (needs TOGETHER_API_KEY + E2E_MODEL=1)"]