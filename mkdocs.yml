site_name: Framework Agents
site_description: TypeScript-first + Python-parity agent framework — tools, streaming, budgets, middleware, multi-agent, semantic graph, A2A serving
site_url: https://fab679.github.io/framework/
repo_url: https://github.com/fab679/framework
repo_name: fab679/framework
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - TypeScript: getting-started/typescript.md
      - Python: getting-started/python.md
      - Live examples (both languages): getting-started/live-examples.md
  - Guides:
      - Agents & tools: guides/agents-and-tools.md
      - Streaming & events: guides/streaming.md
      - Structured output: guides/structured-output.md
      - Budgets & pricing: guides/budgets.md
      - Memory & sessions: guides/memory-sessions.md
      - Middleware & HITL: guides/middleware.md
      - Multi-agent: guides/multi-agent.md
      - Semantic graph (P2-sem): guides/semantic.md
      - A2A & serving: guides/a2a-serving.md
      - MCP clients: guides/mcp.md
      - React (frontend): guides/react.md
      - Sandbox & rag & skills: guides/sandbox-rag-skills.md
      - Design docs (vision, architecture, roadmap): design/index.md
  - API reference:
      - TypeScript: api/typescript.md
      - Python: api/python.md
      - React hook: api/react.md
      - Errors & retry contract: api/errors.md
  - Reference:
      - Pinned semantics: reference/pinned-semantics.md
      - Cross-language parity: reference/parity.md
      - Publishing (npm/PyPI): reference/publishing.md

plugins:
  - search